<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Men's Miche 投稿ツール</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#F1F3F6;--surface:#fff;--line:#D1D9E0;--ink:#1A2332;--ink-mid:#4A5568;--ink-faint:#9AA5B4;
  --pri:#1E3A5F;--pri-light:#EBF0F7;--pri-mid:#152B47;
  --radius:14px;--font:'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:var(--font);color:var(--ink);min-height:100vh;}
.app{max-width:720px;margin:0 auto;padding:0 16px 80px;}
.hdr{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.hdr-logo{width:38px;height:38px;border-radius:10px;background:var(--pri);display:flex;align-items:center;justify-content:center;font-size:18px;}
.hdr-title{font-size:15px;font-weight:700;}
.hdr-sub{font-size:11px;color:var(--ink-faint);}
.hdr-btns{margin-left:auto;display:flex;gap:8px;}
.hdr-btn{background:none;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink-mid);display:flex;align-items:center;gap:4px;}
.hdr-btn:hover{background:var(--pri-light);border-color:var(--pri);color:var(--pri-mid);}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);display:flex;padding:0 20px;gap:24px;}
.tab{padding:12px 0;font-size:13px;font-weight:400;color:var(--ink-faint);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;}
.tab.active{color:var(--pri);font-weight:700;border-bottom-color:var(--pri);}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:20px;margin-top:16px;}
.card-label{font-size:11px;font-weight:700;color:var(--ink-faint);letter-spacing:.1em;margin-bottom:8px;text-transform:uppercase;}
.type-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.type-btn{border:2px solid var(--line);border-radius:10px;padding:10px 4px;background:#FAFAFA;cursor:pointer;text-align:center;}
.type-btn.active{border-color:var(--pri);background:var(--pri-light);}
.type-btn .emoji{font-size:18px;display:block;margin-bottom:4px;}
.type-btn .name{font-size:11px;font-weight:600;color:var(--ink-mid);}
.type-btn.active .name{color:var(--pri-mid);}
.style-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.style-chip{padding:6px 14px;border-radius:20px;border:2px solid var(--line);background:#FAFAFA;font-size:12px;color:var(--ink-mid);cursor:pointer;display:flex;align-items:center;gap:5px;}
.style-chip.active{border-color:var(--pri);background:var(--pri-light);color:var(--pri-mid);font-weight:700;}
textarea,input[type=text],input[type=password]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;font-family:var(--font);color:var(--ink);background:#FAFAFA;resize:vertical;outline:none;transition:border-color .15s;}
textarea:focus,input:focus{border-color:var(--pri);}
.hint{font-size:12px;color:var(--ink-faint);margin-top:6px;line-height:1.6;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);}
.btn-pri{background:var(--pri);color:#fff;width:100%;justify-content:center;padding:14px;font-size:14px;box-shadow:0 4px 14px rgba(30,58,95,.3);}
.btn-pri:disabled{background:#9AB0C8;box-shadow:none;cursor:not-allowed;}
.btn-ghost{background:none;border:1.5px solid var(--line);color:var(--ink-mid);}
.btn-ghost:hover{background:var(--pri-light);border-color:var(--pri);color:var(--pri-mid);}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px;}
.btn-copy{background:#FAFAFA;border:1.5px solid var(--line);color:var(--ink-mid);}
.btn-copy.done{border-color:var(--pri);background:var(--pri-light);color:var(--pri-mid);}
.result-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:18px;margin-top:12px;}
.result-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.platform-badge{display:flex;align-items:center;gap:8px;}
.p-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0;}
.p-name{font-size:13px;font-weight:700;}
.p-sub{font-size:11px;color:var(--ink-faint);}
.result-btns{display:flex;gap:7px;flex-shrink:0;}
.result-body{background:#FAFAFA;border-radius:10px;padding:13px 15px;font-size:14px;line-height:1.85;white-space:pre-wrap;border:1px solid var(--line);min-height:50px;}
.char-count{font-size:11px;color:var(--ink-faint);text-align:right;margin-top:5px;}
.template-toggle{background:none;border:none;cursor:pointer;font-size:12px;color:var(--ink-faint);font-weight:600;display:flex;align-items:center;gap:6px;padding:0;font-family:var(--font);}
.template-box{margin-top:10px;display:flex;flex-direction:column;gap:10px;}
.t-label{font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:5px;}
.star-row{display:flex;gap:8px;margin-bottom:20px;}
.star-btn{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#FAFAFA;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:18px;}
.star-btn.active{border-color:var(--pri);background:var(--pri-light);}
.star-num{font-size:9px;font-weight:700;color:var(--ink-faint);}
.star-btn.active .star-num{color:var(--pri-mid);}
.hist-item{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);padding:16px;margin-top:12px;}
.hist-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.hist-time{font-size:11px;color:var(--ink-faint);}
.hist-tag{font-size:11px;padding:2px 9px;border-radius:5px;background:var(--pri-light);color:var(--pri-mid);font-weight:600;}
.hist-text{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hist-detail{background:#FAFAFA;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;line-height:1.7;color:var(--ink-mid);margin-top:8px;border:1px solid var(--line);}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.overlay-box{background:var(--surface);border-radius:18px;padding:24px;width:100%;max-width:400px;}
.overlay-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.form-label{font-size:12px;font-weight:700;color:var(--ink-faint);margin-bottom:5px;}
.err{margin-top:10px;padding:11px 14px;border-radius:10px;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;font-size:13px;}
.sep{height:1px;background:var(--line);margin:14px 0;}
.empty{text-align:center;padding:48px 0;color:var(--ink-faint);}
.empty-icon{font-size:36px;margin-bottom:10px;}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-logo">🧔</div>
  <div><div class="hdr-title">Men's Miche 投稿ツール</div><div class="hdr-sub">メンズエステ・髭脱毛 • 福井市</div></div>
  <div class="hdr-btns">
    <button class="hdr-btn" onclick="openHist()"><i class="ti ti-clock"></i> 履歴</button>
    <button class="hdr-btn" onclick="openSettings()"><i class="ti ti-settings"></i></button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('post',this)">投稿を作成</button>
  <button class="tab" onclick="switchTab('review',this)">口コミ返信</button>
</div>

<div class="app">
<div id="tab-post">
  <div class="card">
    <div class="card-label">投稿タイプ</div>
    <div class="type-grid">
      <button class="type-btn active" onclick="setType('campaign',this)"><span class="emoji">🎁</span><span class="name">キャン<br>ペーン</span></button>
      <button class="type-btn" onclick="setType('beard',this)"><span class="emoji">✂️</span><span class="name">髭脱毛</span></button>
      <button class="type-btn" onclick="setType('facial',this)"><span class="emoji">✨</span><span class="name">フェイシャル<br>エステ</span></button>
      <button class="type-btn" onclick="setType('knowledge',this)"><span class="emoji">💡</span><span class="name">豆知識</span></button>
      <button class="type-btn" onclick="setType('daily',this)"><span class="emoji">📢</span><span class="name">日常・<br>お知らせ</span></button>
      <button class="type-btn" onclick="setType('image',this)"><span class="emoji">🖼</span><span class="name">画像<br>生成</span></button>
    </div>

    <div class="card-label">投稿スタイル</div>
    <div class="style-row">
      <button class="style-chip active" onclick="setStyle('sharp',this)">⚡ キレ味</button>
      <button class="style-chip" onclick="setStyle('trust',this)">🔷 信頼感</button>
      <button class="style-chip" onclick="setStyle('story',this)">📖 ストーリー</button>
      <button class="style-chip" onclick="setStyle('question',this)">💬 問いかけ</button>
      <button class="style-chip" onclick="setStyle('fact',this)">📊 データ</button>
    </div>
    <div class="hint" id="style-hint">短く刺さる言葉で。余計な修飾なし。男性の心に直球で届ける。</div>

    <div style="margin-top:14px">
      <div class="card-label">投稿内容</div>
      <textarea id="inp" rows="4" placeholder="お知らせ内容を入力（キャンペーン詳細・日程・金額・メニュー名など）"></textarea>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">
        <button class="btn btn-ghost btn-sm" onclick="setEx('髭脱毛キャンペーン。初回体験〇〇円。今月限定。')">例：キャンペーン</button>
        <button class="btn btn-ghost btn-sm" onclick="setEx('40代からのフェイシャルエステ。肌の変化を実感できます。')">例：フェイシャル</button>
        <button class="btn btn-ghost btn-sm" onclick="setEx('髭脱毛の効果が出やすい人・出にくい人の違いについて。')">例：豆知識</button>
      </div>
    </div>

    <div class="sep"></div>
    <button class="template-toggle" onclick="toggleTemplate()">
      <i class="ti ti-chevron-down" id="tmpl-chevron"></i> 定型テキスト設定（冒頭・締め）
      <span id="tmpl-badge" style="display:none;font-size:10px;background:var(--pri-light);color:var(--pri-mid);padding:1px 7px;border-radius:10px;font-weight:700;">設定済み</span>
    </button>
    <div class="template-box" id="tmpl-box" style="display:none;">
      <div><div class="t-label">冒頭テキスト</div>
      <textarea id="tmpl-open" rows="2" placeholder="例：Men's Miche（メンズミーシェ）です。" oninput="saveTmpl()"></textarea></div>
      <div><div class="t-label">締めテキスト（投稿・口コミ返信の末尾に自動追加）</div>
      <textarea id="tmpl-close" rows="2" placeholder="例：ご予約・お問い合わせはプロフィールから。" oninput="saveTmpl()"></textarea></div>
    </div>

    <div style="margin-top:16px;">
      <button class="btn btn-pri" id="gen-btn" onclick="generate()">✦ 3プラットフォーム分の投稿文を生成する</button>
      <div class="err" id="gen-err" style="display:none;"></div>
    </div>
  </div>
  <div id="results"></div>

  <div id="img-section" style="display:none;" class="card">
    <div class="result-hdr">
      <div>
        <div style="font-size:13px;font-weight:700;">🖼 SNS用画像を生成</div>
        <div style="font-size:11px;color:var(--ink-faint);margin-top:2px;">投稿内容に合わせた画像をAIが毎回違う構図・スタイルで生成</div>
      </div>
      <button class="btn btn-ghost btn-sm" id="img-gen-btn" onclick="generateImage()">✦ 画像を生成する</button>
    </div>
    <div id="img-result"></div>
    <div class="err" id="img-err" style="display:none;"></div>
  </div>
</div>

<div id="tab-review" style="display:none;">
  <div class="card">
    <div class="card-label">口コミの評価</div>
    <div class="star-row">
      <button class="star-btn" onclick="setStar(1,this)"><span>★</span><span class="star-num">1</span></button>
      <button class="star-btn" onclick="setStar(2,this)"><span>★★</span><span class="star-num">2</span></button>
      <button class="star-btn" onclick="setStar(3,this)"><span>★★★</span><span class="star-num">3</span></button>
      <button class="star-btn" onclick="setStar(4,this)"><span>★★★★</span><span class="star-num">4</span></button>
      <button class="star-btn active" onclick="setStar(5,this)"><span>★★★★★</span><span class="star-num">5</span></button>
    </div>
    <div class="card-label">お客様名（ニックネーム）</div>
    <input type="text" id="rev-name" placeholder="口コミのニックネーム（不明なら空欄）" style="margin-bottom:14px;">
    <div class="card-label">口コミ内容</div>
    <textarea id="rev-inp" rows="5" placeholder="お客様の口コミ内容をここに貼り付けてください"></textarea>
    <div class="sep"></div>
    <button class="btn btn-pri" id="rev-btn" onclick="generateReview()" style="margin-top:4px;">✦ 口コミ返信文を生成する</button>
    <div class="err" id="rev-err" style="display:none;"></div>
  </div>
  <div id="rev-results"></div>
</div>
</div>

<div class="overlay" id="settings-overlay" onclick="closeIfBg(event,'settings-overlay')">
  <div class="overlay-box">
    <div class="overlay-title">⚙ 設定</div>
    <div style="margin-bottom:14px;"><div class="form-label">Anthropic APIキー</div>
    <input type="password" id="anth-key" placeholder="sk-ant-...">
    <div class="hint">投稿文生成に使用。端末に保存されます。</div></div>
    <div style="margin-bottom:14px;"><div class="form-label">OpenAI APIキー</div>
    <input type="password" id="open-key" placeholder="sk-...">
    <div class="hint">画像生成（gpt-image-1）に使用。</div></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-ghost" style="flex:1;" onclick="closeSettings()">キャンセル</button>
      <button class="btn btn-pri" style="flex:1;" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<div class="overlay" id="hist-overlay" onclick="closeIfBg(event,'hist-overlay')">
  <div class="overlay-box" style="max-width:640px;max-height:80vh;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <div class="overlay-title" style="margin:0;">🕘 投稿履歴</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost btn-sm" onclick="exportCSV()"><i class="ti ti-file-spreadsheet"></i> CSV</button>
        <button class="btn btn-ghost btn-sm" onclick="clearHist()"><i class="ti ti-trash"></i> 全削除</button>
        <button class="btn btn-ghost btn-sm" onclick="closeHist()">閉じる</button>
      </div>
    </div>
    <div id="hist-list" style="overflow-y:auto;flex:1;"></div>
  </div>
</div>

<script>
let ST={type:'campaign',style:'sharp',star:5,lastResult:null};
const STYLE_DESC={
  sharp:'短く刺さる言葉で。余計な修飾なし。男性の心に直球で届ける。',
  trust:'信頼感・実績・専門性を前面に。落ち着いた誠実なトーン。',
  story:'実際の変化・体験談から入る。リアリティのある共感ストーリー。',
  question:'「髭に悩んでいませんか？」男性特有の悩みへの問いかけから入る。',
  fact:'数字・データ・具体的な効果で引きつける。実績と根拠で話す。',
};
const STYLE_PROMPT={
  sharp:'短くキレのある言葉で。余計な修飾語を削ぎ落として直球で伝える。男性が読んで「これだ」と思う簡潔さ。',
  trust:'信頼感と専門性を前面に出す落ち着いたトーン。実績と技術力で語る。',
  story:'実際の変化・体験談から入る。「通い始めて3ヶ月、鏡を見るのが楽しくなった」のようなリアリティのある描写。',
  question:'男性特有の髭や肌の悩みへの問いかけから入る。「毎日の髭剃り、もう限界じゃないですか？」のように悩みに刺さる。',
  fact:'数字・データ・具体的な効果で引きつける。「月2回・15,950円・卒業まで〇回」のように具体的な情報で話す。',
};
const TYPE_LABEL={campaign:'キャンペーン',beard:'髭脱毛',facial:'フェイシャルエステ',knowledge:'豆知識',daily:'日常・お知らせ',image:'画像生成'};
const OPENING_BANK=[
  '男性特有の悩み・状況への共感から入る（「毎日の髭剃りで肌が荒れていませんか？」など）',
  '具体的な変化・結果から入る（「通い始めて3ヶ月で〇〇が変わった」など）',
  '数字・データから入る（施術回数・効果・時間など具体的な数字）',
  '逆説・意外な切り口から入る（「実は、フェイシャルを始める男性が増えている理由」など）',
  'シーン・状況描写から入る（「出張前夜、また髭を剃って...」など日常の一コマ）',
  '問いかけから入る（「鏡で自分の顔、最近ちゃんと見ていますか？」など）',
];
const HPB_FOOTER='\n\nLINE ID：@576lhvdx\nMen\'s Miche（メンズミーシェ）\n福井市高木中央3丁目1905番地ベルプリュネル\n営業時間：10:00〜18:30\n定休日：水曜日';
const IMG_PROMPTS=[
  "A confident stylish Japanese man, early 40s, clean-shaved smooth face, sitting in a modern premium men's beauty salon. Neat short hair, well-groomed appearance, smart casual attire. Relaxed natural expression. Clean minimal salon interior with dark navy or charcoal grey tones, warm ambient lighting. Professional lifestyle photography, men's beauty editorial style. No text.",
  "Close-up portrait of a well-groomed Japanese man, mid-30s to 40s, smooth flawless skin, confident relaxed expression. Clean modern salon background softly blurred. Premium men's grooming aesthetic. Warm professional lighting, editorial photography quality.",
  "A sophisticated Japanese man, 40s, in a sleek modern treatment chair at an upscale men's salon. Clean-shaved, healthy glowing skin. Minimal dark interior design. Confident and relaxed. Premium men's beauty brand campaign photography. No text.",
];

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function ls(k,d){try{return localStorage.getItem(k)||d;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch{}}
function ge(id){return document.getElementById(id);}

window.onload=()=>{
  ge('anth-key').value=ls('mens_anth','');
  ge('open-key').value=ls('mens_open','');
  ge('tmpl-open').value=ls('mens_tmpl_open','');
  ge('tmpl-close').value=ls('mens_tmpl_close','');
  updateTmplBadge();
};

function switchTab(id,el){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');ge('tab-post').style.display=id==='post'?'':'none';ge('tab-review').style.display=id==='review'?'':'none';}
function setType(t,el){ST.type=t;document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function setStyle(s,el){ST.style=s;document.querySelectorAll('.style-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');ge('style-hint').textContent=STYLE_DESC[s]||'';}
function setEx(v){ge('inp').value=v;}
function setStar(n,el){ST.star=n;document.querySelectorAll('.star-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}

let tmplOpen=false;
function toggleTemplate(){tmplOpen=!tmplOpen;ge('tmpl-box').style.display=tmplOpen?'flex':'none';ge('tmpl-chevron').className=tmplOpen?'ti ti-chevron-up':'ti ti-chevron-down';}
function saveTmpl(){lsSet('mens_tmpl_open',ge('tmpl-open').value);lsSet('mens_tmpl_close',ge('tmpl-close').value);updateTmplBadge();}
function updateTmplBadge(){const has=ge('tmpl-open').value.trim()||ge('tmpl-close').value.trim();ge('tmpl-badge').style.display=has?'inline':'none';}
function withTemplate(body){const o=ge('tmpl-open').value.trim(),c=ge('tmpl-close').value.trim();const parts=[];if(o)parts.push(o);if(body.trim())parts.push(body.trim());if(c)parts.push(c);return parts.join('\n\n');}
function reviewWithTemplate(body){const c=ge('tmpl-close').value.trim();const parts=[body.trim()];if(c)parts.push(c);return parts.join('\n\n');}

function openSettings(){ge('settings-overlay').classList.add('show');}
function closeSettings(){ge('settings-overlay').classList.remove('show');}
function saveSettings(){lsSet('mens_anth',ge('anth-key').value.trim());lsSet('mens_open',ge('open-key').value.trim());closeSettings();}
function closeIfBg(e,id){if(e.target.id===id)document.getElementById(id).classList.remove('show');}

async function callAnth(prompt,maxTok=1200){
  const key=ls('mens_anth','');
  if(!key)throw new Error('AnthropicのAPIキーを設定してください（⚙ 設定から）');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:maxTok,messages:[{role:'user',content:prompt}]})
  });
  const d=await res.json();
  if(!res.ok)throw new Error(d?.error?.message||'API Error');
  return d.content.map(b=>b.text||'').join('');
}

function fixJSON(str){let r='',inS=false,esc=false;for(let i=0;i<str.length;i++){const c=str[i];if(esc){r+=c;esc=false;}else if(c==='\\'&&inS){r+=c;esc=true;}else if(c==='"'){r+=c;inS=!inS;}else if(inS&&c==='\n'){r+='\\n';}else if(inS&&c==='\r'){r+='\\r';}else{r+=c;}}return r;}
function parseJSON(text){text=text.replace(/```json|```/g,'').trim();const s=text.indexOf('{'),e=text.lastIndexOf('}');if(s!==-1&&e!==-1){const j=text.slice(s,e+1);try{return JSON.parse(j);}catch{return JSON.parse(fixJSON(j));}}return JSON.parse(text);}

${STYLE_PROMPT[style]}

async function generate(){
  const inp=ge('inp').value.trim();
  if(!inp){showErr('gen-err','投稿内容を入力してください。');return;}
  hideErr('gen-err');
  const btn=ge('gen-btn');

async function regenPlatform(pid){
  const inp=ge('inp').value.trim();
  if(!inp||!ST.lastResult)return;
  const btn=document.querySelector(`[onclick="regenPlatform('${pid}')"]`);
  if(btn){btn.textContent='...';btn.disabled=true;}
  try{
    const text=await callAnth(buildSinglePrompt(inp,ST.type,ST.style,pid,ST.lastResult[pid]||''),600);
    const parsed=parseJSON(text);
    if(parsed[pid]){ST.lastResult[pid]=parsed[pid];const el=ge('body-'+pid);if(el)el.innerHTML=escHtml(parsed[pid]);const cc=ge('cc-'+pid);if(cc)cc.textContent=withTemplate(parsed[pid]).length+'文字';const cb=pid==='hpb'?withTemplate(parsed[pid]+HPB_FOOTER):withTemplate(parsed[pid]);const copyBtn=ge('copy-'+pid);if(copyBtn)copyBtn.onclick=()=>copyText(pid,cb);}
  }catch(e){alert(e.message);}
  if(btn){btn.textContent='↺ 別パターン';btn.disabled=false;}
}

async function generateImage(){

  try{

}

function getHist(){try{return JSON.parse(localStorage.getItem('mens_hist')||'[]');}catch{return[];}}
function saveToHistory(inp,type,style,result){const hist=getHist();hist.unshift({id:Date.now(),at:new Date().toLocaleString('ja-JP'),inp,type,style,result});try{localStorage.setItem('mens_hist',JSON.stringify(hist.slice(0,30)));}catch{}}
function openHist(){renderHistList();ge('hist-overlay').classList.add('show');}
function closeHist(){ge('hist-overlay').classList.remove('show');}
function renderHistList(){
  const hist=getHist();
  if(!hist.length){ge('hist-list').innerHTML='<div class="empty"><div class="empty-icon">📋</div>履歴がありません</div>';return;}
  let html='';
  for(const h of hist){
    html+=`<div class="hist-item" id="hi-${h.id}"><div class="hist-meta"><span class="hist-time">${h.at}</span><span class="hist-tag">${TYPE_LABEL[h.type]||h.type}</span></div><div class="hist-text">${escHtml(h.inp)}</div><div id="hd-${h.id}" style="display:none;">${h.result?PLATFORMS.map(p=>`<div style="margin-bottom:8px;"><div style="font-size:11px;font-weight:700;color:var(--ink-faint);margin-bottom:3px;">${p.name}</div><div class="hist-detail">${escHtml(h.result[p.id]||'')}</div></div>`).join(''):''}</div><div style="display:flex;gap:7px;"><button class="btn btn-ghost btn-sm" onclick="toggleHD(${h.id})">全文を見る</button><button class="btn btn-ghost btn-sm" onclick="delHist(${h.id})"><i class="ti ti-trash"></i></button></div></div>`;
  }
  ge('hist-list').innerHTML=html;
}
function toggleHD(id){const el=ge('hd-'+id);if(el)el.style.display=el.style.display==='none'?'block':'none';}
function delHist(id){const hist=getHist().filter(h=>h.id!==id);try{localStorage.setItem('mens_hist',JSON.stringify(hist));}catch{}renderHistList();}
function clearHist(){if(!confirm('全ての履歴を削除しますか？'))return;try{localStorage.removeItem('mens_hist');}catch{}renderHistList();}
function exportCSV(){
  const hist=getHist();if(!hist.length){alert('履歴がありません。');return;}
  const rows=[['日時','タイプ','スタイル','投稿内容','Threads','Google','HPB']];
  for(const h of hist)rows.push([h.at,TYPE_LABEL[h.type]||h.type,h.style,h.inp,h.result?.threads||'',h.result?.google||'',h.result?.hpb||'']);
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='mens_miche_history.csv';a.click();
}
function showErr(id,msg){const el=ge(id);if(el){el.textContent=msg;el.style.display='';}}
function hideErr(id){const el=ge(id);if(el)el.style.display='none';}
